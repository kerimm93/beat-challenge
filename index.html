<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ecdc">
  <meta name="description" content="Deine Schreibimpulse, ein Beat nach dem anderen.">
  <title>Beat Challenge</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="frame masthead">
      <button class="brand" id="home" type="button">
        <svg viewBox="0 0 40 40" width="35" height="35" aria-hidden="true"><rect width="40" height="40" rx="9" fill="currentColor"/><path d="M10 11h8a3 3 0 0 1 3 3v17a4 4 0 0 0-4-4h-7zM30 11h-5m5 6h-5m5 6h-5" fill="none" stroke="var(--paper)" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <span>Beat Challenge<small>Schreibimpulse</small></span>
      </button>
      <button id="theme" class="theme" type="button" aria-label="Dunkle Darstellung" aria-pressed="false">☾</button>
    </div>
  </header>
  <div class="frame feedback">
    <p id="storage-error" role="alert" hidden></p>
    <p id="notice" role="status"></p>
  </div>
  <main class="frame" id="app" aria-busy="true">
    <p>Lokale Daten werden geladen …</p>
    <noscript><p>Beat Challenge benötigt JavaScript.</p></noscript>
  </main>
  <dialog id="finish-dialog" aria-labelledby="finish-title">
    <form method="dialog" class="stack">
      <h2 id="finish-title">Session beenden?</h2>
      <p>Der Verlauf bleibt für den Export verfügbar.</p>
      <div class="actions">
        <button value="cancel" autofocus>Weiterschreiben</button>
        <button class="primary" value="finish">Session abschließen</button>
      </div>
    </form>
  </dialog>
  <footer class="frame footer"><span>Beat Challenge</span><span id="offline-state">Lokale Speicherung</span></footer>
</body>
</html>
